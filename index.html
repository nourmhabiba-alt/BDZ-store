<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #faf7f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #f0e6eb;
    }
    h2 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 24px;
      letter-spacing: -0.5px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid #e5d8e0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: #ff2a7a;
      box-shadow: 0 0 0 3px rgba(255, 42, 122, 0.15);
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #f0e6eb;
      min-height: 220px;
      margin-bottom: 20px;
    }
    #qrcode img {
      border-radius: 8px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #ff2a7a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #e0206b;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>QR Code Generator</h2>
  <p>Enter your website link or payment URL below:</p>
  
  <input type="text" id="text" placeholder="https://yourwebsite.com or payment link..." value="https://bdz-store.com">
  
  <div id="qrcode"></div>

  <button class="btn" onclick="downloadQR()">Download QR Code</button>
</div>

<script>
  const qrContainer = document.getElementById("qrcode");
  const textInput = document.getElementById("text");

  const qrcode = new QRCode(qrContainer, {
    text: textInput.value,
    width: 200,
    height: 200,
    colorDark : "#1a1a1a",
    colorLight : "#ffffff",
    correctLevel : QRCode.CorrectLevel.H
  });

  textInput.addEventListener("input", (e) => {
    const value = e.target.value.trim();
    qrcode.clear();
    if (value) {
      qrcode.makeCode(value);
    }
  });

  function downloadQR() {
    const img = qrContainer.querySelector("img");
    if (img && img.src) {
      const link = document.createElement("a");
      link.href = img.src;
      link.download = "qrcode.png";
      link.click();
    }
  }
</script>

</body>
</html>
